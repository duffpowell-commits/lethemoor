name: build

# Every push: parse all scripts, run the rule tests, then export a web build (for iPhone
# testers via Safari / itch) and a debug APK (for Android). Download both from the run's
# "Artifacts" box on GitHub; the phone can open them straight from the GitHub app/site.
# To save Actions minutes (private repo, 2,000 free/month): CI runs on pushes to main and on
# PRs, not on plain branch pushes, and skips changes that only touch docs/, *.md or grok_art/
# (art drops never ship by themselves; Foxboard drops are decoded by foxboard_decode.yml).
# `workflow_dispatch` builds any branch on demand (GitHub app: Actions -> build -> Run workflow).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "grok_art/**"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "grok_art/**"]
  workflow_dispatch:

# A newer push to the same PR cancels the older run still in progress. Never on main, so the
# dev release always gets its upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GODOT_VERSION: 4.5-stable

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
      - name: Import
        run: godot --headless --path . --import || true
      - name: Parse every script
        # A parse error makes a scene hang instead of failing, so check them all.
        run: |
          fail=0
          for f in $(git ls-files '*.gd'); do
            if godot --headless --path . --check-only --script "$f" 2>&1 | grep -E "Parse Error|SCRIPT ERROR"; then
              echo "::error file=$f::parse error"; fail=1
            fi
          done
          exit $fail
      - name: Rule tests
        run: godot --headless --path . --script tests/run_tests.gd
      - name: Play the slice (real taps; checks the camera moves, not just the rules)
        # The view can be broken while every rule test passes (Nov 19: steps moved the sim but
        # not the camera). This plays title -> hint -> walk -> bell -> letter -> death -> Stalker.
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          timeout 600 xvfb-run -a -s "-screen 0 1080x1920x24" godot --path . --rendering-driver opengl3 \
            --resolution 1080x1920 res://scenes/fp_room.tscn -- --capture 2>&1 | tee capture.log | grep -E "PASS|FAIL|SCRIPT ERROR" || true
          ! grep -qE "FAIL|SCRIPT ERROR|^ERROR: .*(Failed loading|Cannot open|Node not found|Invalid)" capture.log
          grep -q "STALKER PASS" capture.log
          grep -q "^ART PASS" capture.log   # the capture's last line: a crash or hang in passes 3-4 fails here

  export:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Godot + export templates
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
      - name: Android SDK paths + signing key
        # Every APK must be signed with the SAME key or Android refuses to update the installed
        # app (the in-app updater depends on it). The key is committed ENCRYPTED in
        # signing/lethemoor.keystore.enc (alias androiddebugkey, store/key password android);
        # the LM_KEYSTORE_PASS repo secret unlocks it. Without the secret (forks) a throwaway
        # key is made: that APK installs fresh but can't update an installed one.
        env:
          LM_KEYSTORE_PASS: ${{ secrets.LM_KEYSTORE_PASS }}
        run: |
          if [ -n "$LM_KEYSTORE_PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/lethemoor.keystore.enc \
              -out debug.keystore -pass env:LM_KEYSTORE_PASS
            keytool -list -keystore debug.keystore -storepass android | grep -i "SHA-256"
            echo "Signing with the fixed key"
          else
            echo "::warning::LM_KEYSTORE_PASS not set: throwaway signing key, this APK can't update an installed one"
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<TRES
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          TRES
          cp ~/.config/godot/editor_settings-4.5.tres ~/.config/godot/editor_settings-4.tres
      - name: Import
        run: godot --headless --path . --import || true
      - name: Export web
        run: |
          echo "${GITHUB_SHA::7} $(date -u +%Y-%m-%d) #${{ github.run_number }}" > build.txt   # shown in bug reports
          # Build number: the in-app updater (scripts/updater.gd) compares this with the dev
          # release's version.json; Android needs version/code to rise for an update.
          echo "${{ github.run_number }}" > build_code.txt
          sed -i 's/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name="0.1.${{ github.run_number }}"/' export_presets.cfg
          grep -n "^version/" export_presets.cfg
          mkdir -p build/web && touch build/.gdignore
          # Files are named per build (lethemoor-<sha>.js/.wasm/.pck) so a phone can never pair a new
          # page with an old cached engine or pack; index.html is a copy of that build's page.
          godot --headless --path . --export-release "Web" build/web/lethemoor-${GITHUB_SHA::7}.html
          cp build/web/lethemoor-${GITHUB_SHA::7}.html build/web/index.html
          ls -la build/web
      - name: Export Android (debug APK)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/lethemoor.apk 2>&1 | tee export.log
          grep -A8 "configuration errors" export.log || true
          test -f build/android/lethemoor.apk
          ls -la build/android
      - name: Check the APK can update itself
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt
          $AAPT dump badging build/android/lethemoor.apk | grep -E "^package:"
          $AAPT dump permissions build/android/lethemoor.apk | tee perms.txt
          grep -q "REQUEST_INSTALL_PACKAGES" perms.txt
          grep -q "android.permission.INTERNET" perms.txt
          $AAPT dump badging build/android/lethemoor.apk | grep -q "versionCode='${{ github.run_number }}'"
      - uses: actions/upload-artifact@v4
        with:
          name: lethemoor-web
          path: build/web
      - uses: actions/upload-artifact@v4
        with:
          name: lethemoor-apk
          path: build/android/lethemoor.apk
      - name: Publish to the "dev" release (main only)
        # One fixed release Duff can open on his phone: Releases -> dev -> tap the APK.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build/web && zip -qr ../lethemoor-web.zip .)
          gh release view dev >/dev/null 2>&1 || gh release create dev --prerelease --title "Latest dev build" --notes "Rebuilt on every push to main."
          gh release upload dev build/android/lethemoor.apk build/lethemoor-web.zip --clobber
          # version.json goes up LAST, so a phone never sees a build number before its APK is there.
          echo "{\"code\": ${{ github.run_number }}, \"sha\": \"${GITHUB_SHA::7}\"}" > build/version.json
          gh release upload dev build/version.json --clobber
          gh release edit dev --notes "Rebuilt on every push to main. Last: ${GITHUB_SHA::7}"
      - name: Publish web build to GitHub Pages (main only)
        # Brittany's link: https://duffpowell-commits.github.io/lethemoor/ (plays in iPhone Safari).
        # Force-pushes build/web as the only commit on the gh-pages branch. Threads are off in the
        # Web preset, so Pages needs no special COOP/COEP headers.
        if: github.ref == 'refs/heads/main'
        run: |
          cd build/web
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "web build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
