html/head_include="<script>/* Lethemoor: unlock sound on the first tap (Safari/Chrome start audio suspended). Wraps AudioContext so every context the engine makes is resumed inside a real user gesture. */(function(){var A=window.AudioContext||window.webkitAudioContext;if(!A)return;var L=[];var W=function(o){var c=new A(o);L.push(c);return c;};W.prototype=A.prototype;window.AudioContext=W;if(window.webkitAudioContext)window.webkitAudioContext=W;var R=function(){L.forEach(function(c){if(c.state!=='running'){c.resume();try{var s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0);}catch(e){}}});};['touchend','pointerup','click','keydown'].forEach(function(e){window.addEventListener(e,R,true);});window.lmAudioState=function(){return L.map(function(c){return c.state;}).join(',');};})();/* Lethemoor: REPORT A BUG on Safari. The game queues an open/copy; the next real tap runs it (Safari only allows these inside a gesture). */(function(){window.lmQueue=null;var Q=function(){var q=window.lmQueue;if(!q)return;window.lmQueue=null;if(q.k==='open'){if(q.v.indexOf('sms:')===0){window.location.href=q.v;}else{window.open(q.v,'_blank');}}else if(navigator.clipboard){navigator.clipboard.writeText(q.v).catch(function(){});}};['touchend','click'].forEach(function(e){window.addEventListener(e,Q,true);});})();</script>"
